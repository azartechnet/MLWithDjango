
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .prediction-card {
            max-width: 500px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
        }

        h2 {
            color: #173b70;
        }

        .result {
            background: #e4f7e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="prediction-card">

        <h2 class="text-center mb-3">
            House Price Prediction
        </h2>

        <p class="text-center text-muted">
            Machine Learning using Linear Regression
        </p>

        <form method="POST">
            {% csrf_token %}

            <label class="form-label" for="area">
                Enter House Area (sq. ft.)
            </label>

            <input
                type="number"
                id="area"
                name="area"
                class="form-control mb-3"
                placeholder="Example: 1500"
                min="1"
                step="any"
                value="{{ area }}"
                required
            >

            <button type="submit"
                    class="btn btn-primary w-100">
                Predict Price
            </button>
        </form>

        {% if predicted_price != None %}
        <div class="result text-center">
            <h5>Predicted House Price</h5>
            <h3>₹ {{ predicted_price }} Lakhs</h3>
            <p class="mb-0">
                Estimated price for {{ area }} sq. ft.
            </p>
        </div>
        {% endif %}

    </div>
</div>
</body>
</html>
